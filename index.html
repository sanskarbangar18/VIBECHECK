<style>
:root{--v:#7C3AED;--p:#EC4899;--c:#06B6D4;--bg:#0A0614;--fg:#F5F3FF;--mut:#A9A3C7;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--glow:rgba(124,58,237,.35)}
html.light{--bg:#F7F5FF;--fg:#1A1433;--mut:#5F5880;--card:rgba(255,255,255,.75);--line:rgba(26,20,51,.1);--glow:rgba(236,72,153,.18)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,'Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;line-height:1.5;
background-image:radial-gradient(60vw 40vw at 10% -10%,var(--glow),transparent),radial-gradient(50vw 40vw at 110% 10%,rgba(6,182,212,.16),transparent);background-attachment:fixed}
h1,h2,h3{font-family:Outfit,Inter,'Noto Sans Devanagari',sans-serif;letter-spacing:-.02em;margin:0 0 .4em;line-height:1.15}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 75%,transparent);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav .wrap{display:flex;align-items:center;gap:10px;min-height:64px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:800 20px Outfit,sans-serif;text-decoration:none}
.links{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.links a{padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--mut);font-size:14px}
.links a:hover{color:var(--fg);background:var(--card)}
select{width:auto!important;padding:8px 10px!important;font-size:14px!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font:600 15px Inter,'Noto Sans Devanagari',sans-serif;color:#fff;background:linear-gradient(135deg,var(--v),var(--p));cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .2s;box-shadow:0 10px 30px -12px var(--v);text-align:center}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(12px);padding:22px;margin-top:16px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.grid.two{grid-template-columns:1fr}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,transparent);color:var(--fg);font:15px Inter,'Noto Sans Devanagari',sans-serif}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.hero{padding:64px 0 28px;text-align:center}
.hero h1{font-size:clamp(40px,8vw,84px);font-weight:800}
.grad{background:linear-gradient(90deg,var(--v),var(--p),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--p));transition:width .6s cubic-bezier(.2,.8,.2,1);border-radius:99px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font:15px Inter,'Noto Sans Devanagari',sans-serif}
.opt.on{border-color:var(--p);box-shadow:0 0 0 2px color-mix(in srgb,var(--p) 40%,transparent)}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font:700 18px Outfit,sans-serif;color:#fff;background:linear-gradient(135deg,var(--v),var(--c))}
.ad{margin:20px auto;border:1px dashed var(--line);border-radius:14px;padding:8px;text-align:center;min-height:100px}
.ad-label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;font-weight:600;max-width:90vw}
.toast.show{opacity:1}
.confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:60;animation:fall linear forwards;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.crown{color:#FACC15}
.prose p,.prose li{color:var(--mut);line-height:1.7}
.prose h2{margin-top:26px;color:var(--fg)}
.pre{white-space:pre-line}
details{border-top:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:600;font-family:Outfit,sans-serif;font-size:18px}
footer{border-top:1px solid var(--line);margin-top:56px;padding:28px 0;color:var(--mut);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 18px;justify-content:space-between;align-items:center}
footer a{text-decoration:none}
#admin-bar{position:relative;z-index:10;background:var(--card);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hide{display:none!important}
@media(max-width:520px){.links{width:100%;margin-left:0;justify-content:center;order:3}.links a{padding:6px 8px;font-size:13px}.brand{font-size:18px}.hero{padding-top:36px}.glass{padding:18px;border-radius:20px}.btn{padding:12px 16px}.hero .row{flex-direction:column;align-items:stretch}.hero .btn{width:100%}}
.item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.qcard{border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;background:color-mix(in srgb,var(--bg) 35%,transparent)}
.opts{display:grid;gap:8px;grid-template-columns:1fr;margin-top:8px}
@media(min-width:620px){.opts{grid-template-columns:1fr 1fr}}
.opts label{display:flex;gap:8px;align-items:center;margin:0;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 'legal.about.t':'VibeClash के बारे में','legal.about.b':'<p>VibeClash एक मुफ़्त, बिना साइनअप वाली मनोरंजन साइट है। यहाँ AI टॉपिक क्विज़, दोस्तों की क्विज़, स्क्वाड वोट और शेयर करने योग्य स्टोरी कार्ड मिलते हैं। कोई भी खेल सकता है।</p>',
 'legal.priv.t':'प्राइवेसी पॉलिसी','legal.priv.b':'<p>यह बताती है कि VibeClash जानकारी कैसे संभालता है।</p><h2>तुम जो जानकारी देते हो</h2><p>नाम, फ़ोटो, क्विज़ के टॉपिक, सवाल, जवाब और वोट सिर्फ़ तुम्हारे पेज और कार्ड बनाने के लिए इस्तेमाल होते हैं। फ़ोटो इस्तेमाल से पहले ब्राउज़र में छोटी की जाती हैं।</p><h2>डेटा कहाँ रहता है</h2><p>डिफ़ॉल्ट रूप से क्विज़, वोट और स्कोर तुम्हारे ब्राउज़र में सेव होते हैं। शेयर किए गए लिंक में क्विज़ का डेटा होता है, इसलिए लिंक वाला कोई भी उसे देख सकता है। निजी जानकारी न डालो।</p><h2>कुकीज़ और विज्ञापन</h2><p>हम Google AdSense के विज्ञापन दिखा सकते हैं। Google और उसके साथी कुकीज़ (जिसमें DART कुकी भी है) इस्तेमाल करते हैं। निजी विज्ञापनों से बाहर निकलने के लिए Google Ads Settings या www.aboutads.info देखो।</p><h2>बच्चे</h2><p>VibeClash 13 साल और उससे ऊपर के उपयोगकर्ताओं के लिए है।</p>',
 'legal.terms.t':'नियम और शर्तें','legal.terms.b':'<h2>सेवा का उपयोग</h2><p>VibeClash का उपयोग निजी, गैर-व्यावसायिक मनोरंजन के लिए करो। इसे तोड़ने, स्क्रैप करने या ओवरलोड करने की कोशिश न करो।</p><h2>उपयोगकर्ता का कंटेंट</h2><p>तुम जो भी पोस्ट करते हो, उसकी जिम्मेदारी तुम्हारी है। किसी और की फ़ोटो इस्तेमाल करने से पहले अनुमति लो।</p><h2>प्रतिबंधित कंटेंट</h2><p>बुलिंग, उत्पीड़न, नफ़रत भरी बातें, धमकी, यौन या नग्न कंटेंट, बच्चों से जुड़ा कंटेंट, या किसी के अधिकारों का उल्लंघन मना है। नियम तोड़ने पर कंटेंट हटाया जा सकता है।</p><h2>AI से बना कंटेंट</h2><p>AI क्विज़ में गलतियाँ हो सकती हैं। शेयर करने से पहले क्रिएटर को जाँचना होगा।</p>',
 'legal.disc.t':'अस्वीकरण','legal.disc.b':'<p>VibeClash सिर्फ़ मनोरंजन के लिए है। स्कोर, बैज, वोट नतीजे और AI क्विज़ वैज्ञानिक माप, परीक्षा सामग्री या पेशेवर सलाह नहीं हैं। भरोसा करने से पहले तथ्य विश्वसनीय स्रोत से जाँचो।</p>'

function enc(o){ let s=''; new TextEncoder().encode(JSON.stringify(o)).forEach(x=>s+=String.fromCharCode(x)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'') }
function dec(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))) }

function rr(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath() }
function wrapText(x,txt,cx,y,max,lh){ const words=String(txt).split(' '); let line=''; for(const w of words){ const test=line?line+' '+w:w; if(x.measureText(test).width>max&&line){ x.fillText(line,cx,y); line=w; y+=lh } else line=test } x.fillText(line,cx,y); return y }
const FONT_STACK = "Outfit, Inter, 'Noto Sans Devanagari', system-ui, sans-serif";
async function buildStory({kicker,title,rows,foot}){
  const c=$('#story'), x=c.getContext('2d'); c.width=1080; c.height=1920;
  const g=x.createLinearGradient(0,0,1080,1920); g.addColorStop(0,'#7C3AED'); g.addColorStop(.5,'#EC4899'); g.addColorStop(1,'#06B6D4');
  x.fillStyle=g; x.fillRect(0,0,1080,1920);
  x.fillStyle='rgba(10,6,20,.55)'; rr(x,60,280,960,1300,56); x.fill();
  x.textAlign='center'; x.fillStyle='#fff';
  x.font='800 64px '+FONT_STACK; x.fillText('VibeClash',540,200);
  x.font="600 40px Inter, 'Noto Sans Devanagari', system-ui"; x.fillStyle='rgba(255,255,255,.85)'; x.fillText(kicker||'',540,340);
  x.fillStyle='#fff'; x.font='800 80px '+FONT_STACK; const endY=wrapText(x,title||'',540,440,880,94);
  const top=Math.max(endY+90,600), sp=rows.length?Math.min(170,Math.floor((1400-top)/rows.length)):0, rad=Math.min(56,sp/2-8);
  let y=top;
  for(const r of rows.slice(0,8)){
    const img=await loadImg(r.img), cy=y+sp/2-8;
    x.save(); x.beginPath(); x.arc(170,cy,rad,0,Math.PI*2); x.clip();
    if(img) x.drawImage(img,170-rad,cy-rad,rad*2,rad*2); else { x.fillStyle='#7C3AED'; x.fillRect(100,cy-rad,rad*2+20,rad*2); x.fillStyle='#fff'; x.font='700 40px '+FONT_STACK; x.textAlign='center'; x.fillText(ini(r.name),170,cy+14) }

  const cards=ppl.map(([nm,img],i)=>`<div class="glass" style="display:flex;gap:14px;align-items:center;margin-top:12px">${avatar(img,nm)}<div style="flex:1;min-width:0">
    <div class="row" style="justify-content:space-between"><b>${esc(nm)} <span class="crown" data-crown="${i}">${(max>0&&c[i]===max)?'👑':''}</span></b><span><span data-cnt="${i}">${c[i]}</span> ${t('v.votes')} · <span data-pct="${i}">${pctOf(i)}</span>%</span></div>
    <div class="bar" style="margin:8px 0 10px"><i data-bar="${i}" style="width:${pctOf(i)}%"></i></div>
    ${me==null?`<button class="btn sm" data-act="vote-cast" data-i="${i}">${t('v.voteFor',{n:esc(nm)})}</button>`:(me===i?`<span class="pill">${t('v.yours')}</span>`:'')}
    </div></div>`).join('');
  const rows=ppl.map(([nm,img],i)=>({name:nm,pct:pctOf(i),img,crown:max>0&&c[i]===max}));
  const url=shareUrl('#/vote/play?d='+enc(data));
  clearInterval(VLIVE); VLIVE=setInterval(()=>paintVotes(id,n),2000);
  setTimeout(()=>paintVotes(id,n),0);
  return page(`<span class="pill">${t('v.squad')}</span><h1 style="margin-top:10px">${esc(data.t)}</h1><p style="color:var(--mut)">${me==null?t('v.tap'):t('v.thanks')}</p>
    ${cards}
    <div style="margin-top:14px">${sharePanel(url,`${data.t}! ${url}`,{kicker:t('v.squad'),title:data.t,rows,foot:t('story.vote')})}</div>
    ${ad('result')}${continueBar()}`);
}
function castVote(i){
  if(!VP) return;
  if(store.get('vc_me_'+VP.id,null)!=null) return toast(t('toast.already'));
  const c=countsOf(VP.id,VP.n); c[i]++;
  store.set('vc_v_'+VP.id,c); store.set('vc_me_'+VP.id,i);
  confetti(); route();
}

/* ================= LEGAL / CONTACT ================= */
function prose(title,html){ return page(`<div class="prose"><h1>${esc(title)}</h1>${html}</div>`) }
function contactView(){ return page(`<h1>${t('c.title')}</h1><p style="color:var(--mut)">${t('c.desc')}</p>
  <form id="cform" class="glass"><label for="cn">${t('c.name')}</label><input id="cn" name="name" required maxlength="60"><label for="ce">${t('c.email')}</label><input id="ce" name="email" type="email" required maxlength="120"><label for="cm">${t('c.msg')}</label><textarea id="cm" name="message" rows="5" required maxlength="2000"></textarea><button class="btn" style="margin-top:16px;width:100%">${t('c.send')}</button></form>`) }

/* ================= ADMIN (hidden: #admin; labels in English) ================= */
let ADM_TAB='sections';
async function sha256(x){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)); return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('') }
function syncAdminBar(){
  const bar=$('#admin-bar'), logged=sessionStorage.getItem('vc_admin')==='1';
  if(logged){ bar.classList.remove('hide'); bar.innerHTML=`<div class="wrap row" style="height:52px"><span class="pill">Admin mode</span><a class="btn ghost sm" href="#/admin">Dashboard</a><button class="btn ghost sm" data-act="admin-out" style="margin-left:auto">Log out</button></div>` }
  else if(location.hash==='#admin'){ bar.classList.remove('hide'); bar.innerHTML=`<form id="alogin" class="wrap row" style="height:auto;padding:12px 18px"><b style="margin-right:auto">Admin sign-in</b><input id="apw" type="password" placeholder="Admin password" autocomplete="current-password" style="max-width:240px" aria-label="Admin password"><button class="btn sm">Sign in</button></form>` }
  else { bar.classList.add('hide'); bar.innerHTML='' }
}
function adminView(){
  if(sessionStorage.getItem('vc_admin')!=='1'){ setTimeout(()=>{ location.hash='#/' },0); return '' }
  const s=settings();
  const tabs={sections:'Sections',trends:'Trends',moderation:'Moderation',keywords:'Keywords',ads:'AdSense'};
  const body={sections:secTab,trends:trendTab,moderation:modTab,keywords:kwTab,ads:adsTab}[ADM_TAB](s);
  return page(`<h1>Admin dashboard</h1>
    <div class="tabs">${Object.entries(tabs).map(([k,l])=>`<button class="btn sm ${ADM_TAB===k?'':'ghost'}" data-act="adm-tab" data-tab="${k}">${l}</button>`).join('')}</div>
    <div class="glass" style="margin-top:0">${body}</div>`);
}
function secTab(s){
  return `<h3>Homepage sections</h3>
  ${s.sections.map((x,i)=>`<div class="item"><input style="flex:1;min-width:180px" value="${esc(secTitle(x))}" data-change="sec-title" data-i="${i}" aria-label="Section title"><label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--fg)"><input type="checkbox" data-change="sec-vis" data-i="${i}" ${x.visible?'checked':''} style="width:auto">Visible</label>
    ${x.type==='text'?`<textarea rows="2" style="flex-basis:100%" data-change="sec-body" data-i="${i}" aria-label="Section body">${esc(secBodyText(x))}</textarea>`:''}
    <span class="row"><button class="btn ghost sm" data-act="sec-up" data-i="${i}">Up</button><button class="btn ghost sm" data-act="sec-down" data-i="${i}">Down</button><button class="btn ghost sm" data-act="sec-del" data-i="${i}">Delete</button></span></div>`).join('')}
  <form id="secform" class="row" style="margin-top:14px"><input name="title" placeholder="New text section title" maxlength="50" required style="flex:1;min-width:180px"><input name="body" placeholder="Body text" maxlength="600" style="flex:2;min-width:220px"><button class="btn sm">Add section</button></form>`;
}
function trendTab(){
  return `<h3>Trending buzz & battles</h3>
  ${trendsData().map(x=>`<div class="item"><b style="flex:1;min-width:160px">${esc(x.head)}</b><span class="pill">${esc(x.cat)}</span><button class="btn ghost sm" data-act="trend-feat" data-id="${esc(x.id)}">${x.feat?'Unfeature':'Feature'}</button><button class="btn ghost sm" data-act="trend-del" data-id="${esc(x.id)}">Delete</button></div>`).join('')}
  <form id="tform" style="margin-top:16px"><div class="grid two"><div><label for="th">Headline</label><input id="th" name="head" required maxlength="100"></div><div><label for="tc">Category</label><input id="tc" name="cat" maxlength="30"></div></div>
  <label for="ts">Summary</label><textarea id="ts" name="sum" rows="3" maxlength="300"></textarea>
  <div class="grid two"><div><label for="tg">Tags (comma separated)</label><input id="tg" name="tags" maxlength="120"></div><div><label for="tl">Link (#/quiz/new or https://)</label><input id="tl" name="link" maxlength="200"></div></div>
  <label for="ti">Image URL (optional)</label><input id="ti" name="img" maxlength="400">
  <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" name="feat" style="width:auto">Featured</label>
  <button class="btn" style="margin-top:14px">Publish trend</button></form>`;
}
function modTab(){
  const c=store.get('vc_created',[]);
  return `<h3>Content moderation</h3><p style="color:var(--mut);font-size:14px">Items created on this device. Removing an item blocks its link.</p>
  ${c.length?c.map(x=>`<div class="item"><span style="flex:1">${esc(x.title)}</span><span class="pill">${esc(x.type)}</span><button class="btn ghost sm" data-act="mod-del" data-id="${esc(x.id)}">Remove</button></div>`).join(''):'<p style="color:var(--mut)">Nothing to review yet.</p>'}`;
}
function kwTab(s){ return `<h3>Banned keywords</h3><p style="color:var(--mut);font-size:14px">Comma separated. Names, titles, topics and questions containing these words are blocked.</p><form id="kform"><textarea name="words" rows="4" aria-label="Banned keywords">${esc(s.banned.join(', '))}</textarea><button class="btn" style="margin-top:12px">Save keywords</button></form>` }
function adsTab(s){
  const a=s.adsense;
  return `<h3>AdSense</h3><p style="color:var(--mut);font-size:14px">Ads appear only when enabled and a slot ID is set. Enable only after Google AdSense approves your site.</p>
  <form id="aform"><label for="ac">Publisher ID</label><input id="ac" name="client" placeholder="ca-pub-XXXXXXXXXXXXXXXX" value="${esc(a.client)}">
  <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" name="enabled" ${a.enabled?'checked':''} style="width:auto">Enable ads</label>
  ${['top','inFeed','result'].map(k=>`<div class="grid two" style="margin-top:10px"><div><label for="sl-${k}">${{top:'Top slot ID',inFeed:'In-feed slot ID',result:'Result page slot ID'}[k]}</label><input id="sl-${k}" name="slot_${k}" value="${esc(a.slots[k])}"></div><label style="display:flex;gap:8px;align-items:center;margin-top:30px;color:var(--fg)"><input type="checkbox" name="on_${k}" ${a.on[k]?'checked':''} style="width:auto">Show this slot</label></div>`).join('')}
  <button class="btn" style="margin-top:16px">Save AdSense settings</button></form>`;
}

/* ================= ROUTER ================= */
const VIEWS={'/':home,'/quiz/new':quizNew,'/quiz/build':quizBuild,'/quiz/play':quizPlay,'/vote/new':voteNew,'/vote/play':votePlay,'/trends':trendsView,'/contact':contactView,
  '/about':()=>prose(t('legal.about.t'),t('legal.about.b')),
  '/privacy':()=>prose(t('legal.priv.t'),t('legal.priv.b')),
  '/terms':()=>prose(t('legal.terms.t'),t('legal.terms.b')),
  '/disclaimer':()=>prose(t('legal.disc.t'),t('legal.disc.b')),
  '/admin':adminView};
let LASTPATH=null;
function route(){
  clearInterval(VLIVE);
  chrome();
  const raw=location.hash.startsWith('#/')?location.hash.slice(1):'/';
  const [path,qs]=raw.split('?'); const params=new URLSearchParams(qs||'');
  const view=VIEWS[path]||home;
  $('#app').innerHTML=view(params);
  if(path!==LASTPATH){ window.scrollTo(0,0); LASTPATH=path }
  afterRender(); syncAdminBar();
}

/* ================= EVENTS ================= */
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='theme'){ const light=!document.documentElement.classList.contains('light'); document.documentElement.classList.toggle('light',light); store.set('vc_theme',light?'light':'dark'); return }
  if(act==='quiz-name'){ const n=$('#fname').value.trim(); if(!n) return toast(t('toast.enterName')); if(!ok(n)) return toast(t('toast.diffName')); QP.name=n; QP.step=0; return route() }
  if(act==='quiz-pick'){ QP.ans[QP.step]=+el.dataset.j; return route() }
  if(act==='quiz-next'){ if(QP.ans[QP.step]==null) return; QP.step++; return route() }
  if(act==='quiz-again'){ QP.step=-1; QP.ans=[]; QP.saved=false; QP.name=''; return route() }
  if(act==='q-add'){ if(DRAFT.qs.length>=20) return toast(t('toast.max')); DRAFT.qs.push(['',['','','',''],0]); return route() }
  if(act==='q-del'){ if(DRAFT.qs.length<=3) return toast(t('b.min')); DRAFT.qs.splice(+el.dataset.i,1); return route() }
  if(act==='q-create') return submitQuizDraft();
  if(act==='ai-gen') return genAI();
  if(act==='vote-cast') return castVote(+el.dataset.i);
  if(act==='vote-add'){ const f=$('#people'); if(f.querySelectorAll('.prow').length>=8) return toast(t('toast.max8')); f.insertAdjacentHTML('beforeend',prow()); return }
  if(act==='story') return storyShare(el.dataset.mode);
  if(act==='copy') return copyText(el.dataset.url);
  if(act==='react'){ const rx=store.get('vc_react',{}), k=el.dataset.id; rx[k]=rx[k]||{}; rx[k][el.dataset.e]=(rx[k][el.dataset.e]||0)+1; store.set('vc_react',rx); return route() }
  if(act==='admin-out'){ sessionStorage.removeItem('vc_admin'); location.hash='#/'; return }
  if(act==='adm-tab'){ ADM_TAB=el.dataset.tab; return route() }
  if(act==='sec-up'||act==='sec-down'||act==='sec-del'){
    const s=settings(), i=+el.dataset.i;
    if(act==='sec-del') s.sections.splice(i,1);
    else { const j=act==='sec-up'?i-1:i+1; if(j<0||j>=s.sections.length) return; [s.sections[i],s.sections[j]]=[s.sections[j],s.sections[i]] }
    saveSettings(s); return route();
  }
  if(act==='trend-feat'||act==='trend-del'){
    const tr=trendsData(), i=tr.findIndex(x=>x.id===el.dataset.id); if(i<0) return;
    if(act==='trend-del') tr.splice(i,1); else tr[i].feat=!tr[i].feat;
    store.set('vc_trends',tr); return route();
  }
  if(act==='mod-del'){
    const id=el.dataset.id;
    store.set('vc_created',store.get('vc_created',[]).filter(x=>x.id!==id));
    store.set('vc_blocked',[...new Set([...store.get('vc_blocked',[]),id])]);
    toast(t('toast.removed')); return route();
  }
});
document.addEventListener('input', e=>{
  const d=e.target.dataset;
  if(DRAFT && d.f){
    const i=+d.i, j=+d.j;
    if(d.f==='name') DRAFT.name=e.target.value;
    if(d.f==='tp') DRAFT.tp=e.target.value;
    if(d.f==='q') DRAFT.qs[i][0]=e.target.value;
    if(d.f==='o') DRAFT.qs[i][1][j]=e.target.value;
  }
});
document.addEventListener('change', e=>{
  const tg=e.target, d=tg.dataset;
  if(tg.id==='langsel'){ LANG=tg.value; store.set('vc_lang',LANG); if(DRAFT) DRAFT.lg=LANG; return route() }
  if(tg.id==='vt'){ $('#vc').style.display=tg.value==='custom'?'block':'none'; return }
  if(DRAFT && d.f){
    if(d.f==='c'){ DRAFT.qs[+d.i][2]=+d.j; return }
    if(d.f==='lg'){ DRAFT.lg=tg.value; return }
    if(d.f==='count'){ DRAFT.count=+tg.value; return }
    if(d.f==='diff'){ DRAFT.diff=tg.value; return }
    if(d.f==='photo'){ const f=tg.files[0]; if(f) thumb(f,64).then(v=>{ DRAFT.a=v }).catch(()=>toast(t('toast.photo'))); return }
  }
  const k=d.change; if(!k) return;
  const s=settings(), i=+d.i;
  if(k==='sec-title'){ s.sections[i].title=tg.value.slice(0,50)||s.sections[i].title; delete s.sections[i].titleKey }
  if(k==='sec-vis') s.sections[i].visible=tg.checked;
  if(k==='sec-body'){ s.sections[i].body=tg.value.slice(0,600); delete s.sections[i].bodyKey }
  saveSettings(s); if(k==='sec-vis') route();
});
document.addEventListener('submit', async e=>{
  const f=e.target; if(!f.matches('form')) return;
  e.preventDefault();
  if(f.id==='vform') return submitVote(f);
  if(f.id==='cform'){ const d=new FormData(f); const s=settings(); location.href=`mailto:${s.contactEmail}?subject=${encodeURIComponent('VibeClash contact from '+d.get('name'))}&body=${encodeURIComponent(d.get('message')+'\n\nFrom: '+d.get('email'))}`; toast(t('toast.mail')); return }
  if(f.id==='alogin'){
    if(!ADMIN_SHA256) return toast(t('toast.adminNo'));
    const h=await sha256($('#apw').value);
    if(h===ADMIN_SHA256){ sessionStorage.setItem('vc_admin','1'); location.hash='#/admin' } else toast(t('toast.wrongpw'));
    return;
  }
  if(f.id==='secform'){ const d=new FormData(f); const s=settings(); s.sections.push({id:uid(),type:'text',title:String(d.get('title')).slice(0,50),body:String(d.get('body')||'').slice(0,600),visible:true}); saveSettings(s); return route() }
  if(f.id==='tform'){
    const d=new FormData(f), head=String(d.get('head')||'').trim();
    if(!head) return toast('Headline is required');
    const tr=trendsData();
    tr.unshift({id:uid(),cat:String(d.get('cat')||'Trending').trim()||'Trending',head,sum:String(d.get('sum')||'').trim(),tags:String(d.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,8),link:String(d.get('link')||'').trim(),img:String(d.get('img')||'').trim(),feat:d.get('feat')==='on'});
    store.set('vc_trends',tr); toast('Trend published'); return route();
  }
  if(f.id==='kform'){ const s=settings(); s.banned=String(new FormData(f).get('words')||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).slice(0,500); saveSettings(s); toast('Keywords saved'); return }
  if(f.id==='aform'){
    const d=new FormData(f), s=settings();
    s.adsense={enabled:d.get('enabled')==='on',client:String(d.get('client')||'').trim(),slots:{top:String(d.get('slot_top')||'').trim(),inFeed:String(d.get('slot_inFeed')||'').trim(),result:String(d.get('slot_result')||'').trim()},on:{top:d.get('on_top')==='on',inFeed:d.get('on_inFeed')==='on',result:d.get('on_result')==='on'}};
    saveSettings(s); toast('AdSense settings saved'); return route();
  }
});
window.addEventListener('hashchange', ()=>{ if(location.hash.startsWith('#/quiz/build')) { /* keep draft when switching modes */ } route() });
window.addEventListener('storage', e=>{ if(e.key&&VP&&e.key==='vc_v_'+VP.id) paintVotes(VP.id,VP.n) });

/* ================= BOOT ================= */
LANG = store.get('vc_lang', null) || (navigator.language||'en').slice(0,2);
if(!I18N[LANG]) LANG='en';
if(store.get('vc_theme',null)==='light') document.documentElement.classList.add('light');
route();
</script>
